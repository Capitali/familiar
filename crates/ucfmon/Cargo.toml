[package]
name = "familiar-ucfmon"
version.workspace = true
edition.workspace = true
authors.workspace = true

# A developer's window on the UCF seam. Deliberately its OWN binary, not a `familiar`
# subcommand and not anything the device shells embed: it is an instrument for watching
# the seam, never a participant in it. Nothing here writes to the data dir.
[[bin]]
name = "ucfmon"
path = "src/main.rs"

[dependencies]
familiar-kernel.workspace = true
familiar-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
