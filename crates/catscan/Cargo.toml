[package]
name = "familiar-catscan"
version.workspace = true
edition.workspace = true
authors.workspace = true

# A CAT scan of United Cat Foods. Deliberately its OWN binary, not a `familiar` subcommand and
# not anything the device shells embed: a cat watches the flap, it does not go through it.
# Nothing here writes to the data dir — this cat sheds no fur.
[[bin]]
name = "catscan"
path = "src/main.rs"

[dependencies]
familiar-kernel.workspace = true
familiar-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
