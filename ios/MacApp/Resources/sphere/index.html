<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
  The Familiar — Metal Sphere console (from Claude Design "Familiar Metal Sphere.dc.html").
  Presentation layer only: the Swift host injects real worldview JSON via window.sphereUpdate()
  and relays human acts (answers, gate flips, street dives) through webkit.messageHandlers.
  The street surface is REAL Apple Maps — a native MKMapView the host crossfades in when the
  globe dive reaches map altitude; this page never fakes a map.
  Glyphs over words: controls are animated glyphs; text is data.
-->
<!-- Everything this page needs is in vendor/ and ships inside the app bundle. It loaded three.js,
     the earth textures, qrcode and the fonts from unpkg/Google at RUNTIME before: with no
     network there was no three.js, so the console was a black window rather than a degraded
     one — and a shipping app had a hard dependency on two third-party CDNs. Re-vendor with
     tools/vendor-sphere-assets.sh if a version ever needs bumping. -->
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  a{color:#7aa2ff;text-decoration:none;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:0;height:0;display:none;}
  .hos{scrollbar-width:none;-ms-overflow-style:none;}
  .hos::-webkit-scrollbar{width:0;height:0;display:none;}
  @keyframes aurora{0%{transform:translate(0,0) scale(1);}50%{transform:translate(3%,-2.5%) scale(1.06);}100%{transform:translate(0,0) scale(1);}}
  @keyframes ping{0%{opacity:0.8;transform:scale(0.5);}70%,100%{opacity:0;transform:scale(2.8);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes floaty{0%,100%{transform:translate(-50%,-50%) translateY(0);}50%{transform:translate(-50%,-50%) translateY(-5px);}}
  @keyframes holoflicker{0%,100%{opacity:1;}45%{opacity:0.98;}47%{opacity:0.93;}49%{opacity:0.99;}72%{opacity:0.96;}74%{opacity:1;}}
  @keyframes holoscan{0%{background-position:0 0;}100%{background-position:0 -220px;}}
  @keyframes holobase{0%,100%{opacity:0.7;transform:translateX(-50%) scaleX(0.94);}50%{opacity:1;transform:translateX(-50%) scaleX(1.04);}}
  @keyframes eqb{0%,100%{transform:scaleY(0.45);}50%{transform:scaleY(1);}}
  @keyframes iconpulse{0%,100%{transform:scale(0.85);opacity:0.7;}50%{transform:scale(1.1);opacity:1;}}
  @keyframes dashmove{to{stroke-dashoffset:-144;}}
  @keyframes mer{0%,100%{transform:scaleX(0.2);}50%{transform:scaleX(1);}}
  @keyframes orbitspin{to{transform:rotate(360deg);}}
  @keyframes blink{0%,90%,100%{transform:scaleY(1);}94%{transform:scaleY(0.08);}}
  @keyframes knob{0%,100%{transform:translateX(-7px);}50%{transform:translateX(7px);}}
  @keyframes gatepulse{0%,100%{transform:scale(0.92);opacity:0.85;}50%{transform:scale(1.08);opacity:1;}}
  .scrbtn{position:absolute;transform:translate(-50%,-50%);z-index:8;display:flex;align-items:center;justify-content:center;width:clamp(58px,7.6vmin,94px);height:clamp(58px,7.6vmin,94px);border:none;border-radius:50%;cursor:pointer;transition:background 0.3s,transform 0.2s;background:transparent;}
  .scrbtn span.ic{position:relative;display:block;width:clamp(30px,4.4vmin,54px);height:clamp(30px,4.4vmin,54px);filter:drop-shadow(0 0 7px rgba(120,200,255,0.6));}
  .glybtn{border:1px solid rgba(132,206,255,0.25);background:rgba(9,15,32,0.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#cfe0ff;box-shadow:0 8px 24px rgba(0,0,0,0.4);border-radius:50%;transition:background 0.2s,color 0.2s;}
  .glybtn.on{background:rgba(90,170,255,0.28);color:#f0f7ff;}
  .m{font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div id="root" style="position:relative;width:100vw;height:100vh;overflow:hidden;color:#eef2fb;font-family:'Space Grotesk',-apple-system,sans-serif;">

  <!-- space background — fades out when the native map surfaces -->
  <div id="space" style="position:absolute;inset:0;z-index:0;background:radial-gradient(130% 100% at 50% 0%, #0a1024 0%, #05070f 46%, #03050a 100%);transition:opacity 0.7s;">
    <div style="position:absolute;top:-16vh;left:-12vw;width:52vw;height:52vw;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,0.13),rgba(47,107,255,0) 68%);filter:blur(24px);animation:aurora 24s ease-in-out infinite;"></div>
    <div style="position:absolute;bottom:-20vh;right:-14vw;width:58vw;height:58vw;border-radius:50%;background:radial-gradient(circle,rgba(30,60,170,0.15),rgba(30,60,170,0) 66%);filter:blur(26px);animation:aurora 28s ease-in-out infinite reverse;"></div>
  </div>

  <canvas id="globe" style="position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;transition:opacity 0.7s;"></canvas>

  <div id="vignette" style="position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(3,5,10,0.62) 100%);transition:opacity 0.7s;"></div>

  <div id="callouts" style="position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 0.5s;"></div>

  <!-- electric arcs OVER the real map: the host projects node coordinates to screen points
       (streetArcPoints) and this canvas draws the same lightning language in 2D -->
  <canvas id="streetArcs" style="position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.6s;"></canvas>

  <!-- daemon-down badge: appears only when the link is lost (otherwise no chrome) -->
  <!-- pointer-events:none + pushed below the ring: the badge INFORMS, it must never eat the
       dialogue glyph's clicks (the odd-count ring now parks a button at top centre). -->
  <div id="linkdown" style="display:none;position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:9;flex-direction:column;align-items:center;gap:5px;pointer-events:none;">
    <div style="width:34px;height:34px;border-radius:50%;background:rgba(60,10,16,0.6);border:1px solid rgba(255,110,110,0.5);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff6e6e" stroke-width="1.8" stroke-linecap="round" style="width:18px;height:18px;"><path d="M12 3v10"/><circle cx="12" cy="18.5" r="1.2" fill="#ff6e6e" stroke="none"/></svg>
    </div>
    <div id="linkmsg" class="m" style="max-width:70vw;font-size:9px;color:rgba(255,160,160,0.85);background:rgba(30,8,12,0.55);padding:3px 8px;border-radius:7px;text-align:center;"></div>
  </div>

  <div id="screenbtns"></div>

  <!-- top:53% + 78vh: the holo's top edge clears the ring's top-centre glyph (the odd-count
       ring parks one there), and the tightened header pad tucks the title just inside. -->
  <div id="holo" style="position:absolute;top:53%;left:50%;width:min(1040px,80vw);height:min(78vh,880px);z-index:6;display:flex;flex-direction:column;border-radius:60px;overflow:hidden;background:linear-gradient(158deg,rgba(20,44,80,0.128),rgba(8,20,40,0.056));backdrop-filter:blur(15px) saturate(1.35);-webkit-backdrop-filter:blur(15px) saturate(1.35);box-shadow:0 0 90px rgba(60,150,255,0.13);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 11%,#000 89%,transparent 100%),linear-gradient(90deg,transparent 0%,#000 6%,#000 94%,transparent 100%);-webkit-mask-composite:source-in;-webkit-mask-repeat:no-repeat;animation:floaty 11s ease-in-out infinite,holoflicker 8s ease-in-out infinite;">
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(150,215,255,0.04) 0px,rgba(150,215,255,0.04) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen;animation:holoscan 9s linear infinite;"></div>
    <div style="position:absolute;left:50%;bottom:8%;width:min(60%,520px);height:2px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(150,215,255,0.9),transparent);box-shadow:0 0 22px rgba(120,200,255,0.8);animation:holobase 4.5s ease-in-out infinite;z-index:1;pointer-events:none;"></div>
    <div style="position:relative;z-index:2;flex-shrink:0;display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:clamp(10px,1.6vh,18px) clamp(30px,6vw,84px) clamp(12px,2vh,20px);">
      <div id="sctitle" style="font-size:clamp(24px,3.2vw,36px);font-weight:600;letter-spacing:-0.02em;line-height:1;text-shadow:0.6px 0 rgba(255,80,140,0.25),-0.6px 0 rgba(90,210,255,0.35);"></div>
      <span style="width:7px;height:7px;border-radius:50%;background:#3ddc97;box-shadow:0 0 10px #3ddc97;animation:iconpulse 2.4s ease-in-out infinite;flex-shrink:0;"></span>
    </div>
    <div id="scbody" class="hos" style="position:relative;z-index:2;flex:1;overflow-y:auto;padding:0 clamp(30px,6vw,84px) clamp(30px,5vh,60px);"></div>
  </div>
  <div id="holoRim" style="position:absolute;top:50%;left:50%;width:min(1040px,80vw);height:min(85vh,940px);z-index:6;pointer-events:none;transform:translate(-50%,-50%);animation:floaty 11s ease-in-out infinite;">
    <div style="position:absolute;inset:0;border-radius:60px;padding:1.4px;background:conic-gradient(from 0deg, transparent 0deg, rgba(150,215,255,0.55) 30deg, transparent 82deg, transparent 176deg, rgba(174,231,255,0.5) 208deg, transparent 262deg, transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;filter:blur(1px);opacity:0.42;animation:spin 15s linear infinite,holoflicker 6.5s ease-in-out infinite;"></div>
  </div>

  <!-- device/settings (glyph, top-right) -->
  <!-- Welcome: the door. Pulses red while anyone is waiting to be recognised. Replaces the old
       device/sliders button, which duplicated the ring's Device screen; the capability gates it
       used to reach now live inside that screen, where this device's other settings already are. -->
  <button id="welcomebtn" class="glybtn" title="welcome" onclick="sphereScreen('welcome')" style="position:absolute;top:20px;right:20px;z-index:9;width:46px;height:46px;">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" style="width:24px;height:24px;overflow:visible;">
      <!-- an open doorway with a threshold, and someone standing in it -->
      <path d="M14 42V12a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v30" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
      <line x1="9" y1="42" x2="39" y2="42" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
      <circle id="welcomedot" cx="24" cy="22" r="4.6" fill="currentColor" stroke="none" style="transform-box:fill-box;transform-origin:center;animation:iconpulse 2.6s ease-in-out infinite;"/>
      <path id="welcomearc" d="M17 34c0-4 3.2-7 7-7s7 3 7 7" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- hologram show/hide (glyph) -->
  <button id="holobtn" class="glybtn" title="hologram" style="position:absolute;top:20px;left:20px;z-index:9;width:46px;height:46px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M9 9L4 4M9 9V5.5M9 9H5.5M15 15l5 5M15 15v3.5M15 15h3.5"></path></svg>
  </button>

  <!-- ONE surface control: shows the surface you'd dive to -->
  <!-- The visitor's compass: while this device is a guest, one warm, ever-present pill that
       leads to the path — the two-filter state is never something the human should have to
       infer from a projection looking oddly anonymous. -->
  <button id="guestbar" onclick="sphereScreen('device')" style="display:none;position:absolute;bottom:88px;left:50%;transform:translateX(-50%);z-index:8;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;background:rgba(255,178,102,0.14);border:1px solid rgba(255,178,102,0.45);cursor:pointer;backdrop-filter:blur(8px);">
    <span style="width:8px;height:8px;border-radius:50%;background:#ffb266;box-shadow:0 0 10px #ffb266;animation:gatepulse 1.8s ease-in-out infinite;"></span>
    <span id="guestbartext" class="m" style="font-size:9.5px;letter-spacing:0.14em;color:#ffcf9e;">VISITOR — TAP FOR YOUR PATH TO MEMBERSHIP</span>
  </button>
  <button id="modetoggle" class="glybtn" title="surface" style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:7;width:56px;height:56px;">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" style="width:32px;height:32px;overflow:visible;">
      <path d="M8 40 L18 8 M30 8 L40 40" stroke-width="1.6" opacity="0.7"/>
      <path d="M12 30 H36 M15 20 H33" stroke-width="1.3" opacity="0.5"/>
      <circle cx="24" cy="25" r="3.4" fill="currentColor" stroke="none" style="transform-box:fill-box;transform-origin:center;animation:iconpulse 2.4s ease-in-out infinite;"/>
      <path d="M24 25 v10" stroke-width="1.4" stroke-dasharray="2 3" style="animation:dashmove 1.6s linear infinite;"/>
    </svg>
  </button>

  <!-- loading: spinner only -->
  <div id="loading" style="position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#03050a;">
    <div style="position:relative;width:58px;height:58px;"><div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(90,140,255,0.18);border-top-color:#6c9bff;animation:spin 1s linear infinite;"></div></div>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/three/OrbitControls.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- state & real data ----------
const S = { mode: 'globe', focusIdx: 0, activeScreen: 'roster', holoHidden: false, loading: true, view: null, linkOk: false, builtScreen: '', hideOffline: false, rosterHistory: false, correctServing: false };
try { S.hideOffline = localStorage.getItem('sphere.hideOffline') === '1'; } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Durations ("4h 12m") — for spans like uptime and time-online.
const dur = (secs) => { const s = Math.max(0, secs|0); const d = s/86400|0, h = s%86400/3600|0, m = s%3600/60|0; return d? d+'d '+h+'h' : h? h+'h '+m+'m' : m? m+'m' : s+'s'; };
// Points in time — the standardized console format: YY/MM/DD-HH:MMUTC.
const utc = (ts) => { if (!(ts > 0)) return '—'; const d = new Date(ts*1000); const p = (n) => String(n).padStart(2,'0');
  return String(d.getUTCFullYear()%100).padStart(2,'0') + '/' + p(d.getUTCMonth()+1) + '/' + p(d.getUTCDate()) + '-' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + 'UTC'; };
const dstr = (ts) => ts>0 ? new Date(ts*1000).toISOString().slice(0,10) : '—';
const nowS = () => Date.now()/1000|0;
const hash32 = (str) => { let h = 2166136261>>>0; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h>>>0; };

// A member the mesh has not heard from in a day belongs to the RECORD, not the live roster.
// "Not here right now" and "not a member" are different facts, and the roster should only ever
// answer the first one — a node last seen 25 hours ago sitting between two live ones makes the
// whole panel untrustworthy. The rest live behind the history button, with their dates intact.
const STALE_SECS = 24 * 3600;
const isStale = (p) => {
  const ls = p.m.last_seen || 0;
  return p.status !== 'online' && (!ls || nowS() - ls > STALE_SECS);
};
// Date AND time for the history table — the whole point of it is when, precisely.
const dtstr = (ts) => ts > 0 ? new Date(ts*1000).toISOString().slice(0,16).replace('T',' ') + 'UTC' : '—';

function statusColor(st, kind) { return st === 'online' ? (kind === 'self_node' ? '#aee7ff' : '#3ddc97') : st === 'away' ? '#ffb15a' : 'rgba(140,160,190,0.55)'; }

// SEEN is a point in time (UTC stamp, per the console convention) or the word 'now'. The full
// 'YY/MM/DD-HH:MMUTC' string doesn't fit a stat column at display size, so it splits: `seen`
// is the value a stat cell shows big ('now' / 'HH:MMUTC' / '—'), `seenSub` the small date line
// above it, `seenFull` the one-line form for compact rows.
function seenParts(st, lastSeen) {
  if (st === 'online') return { seen: 'now', seenSub: '', seenFull: 'now' };
  const u = utc(lastSeen);                       // 'YY/MM/DD-HH:MMUTC' (17 chars) or '—'
  if (u.length !== 17) return { seen: u, seenSub: '', seenFull: u };
  return { seen: u.slice(9), seenSub: u.slice(0, 8), seenFull: u };
}
// A SEEN stat cell: 'now' renders big and light; a stamp stacks date-over-time in mono at a
// size that keeps the SESSION/TOTAL columns beside it in place whatever the clock says.
const seenCell = (p, bigPx, timePx) => p.seenSub
  ? `<div class="m" style="font-size:${Math.round(timePx * 0.6)}px;color:rgba(160,195,255,0.6);margin-bottom:3px;">${esc(p.seenSub)}</div><div class="m" style="font-size:${timePx}px;font-weight:300;line-height:0.85;color:#e4f2ff;">${esc(p.seen)}</div>`
  : `<div style="font-size:${bigPx}px;font-weight:300;line-height:0.85;color:#e4f2ff;">${esc(p.seen)}</div>`;
const FRONTIER_COLOR = '#7d93a8';

// Members → located mesh nodes. Real coordinates only: a node that reported none clusters
// near the anchor (first located member) with a small deterministic spread, and its card
// says the position is approximate. No invented places.
// `all` ignores the hide-offline preference. Pass it wherever the list must be COMPLETE
// rather than a view of activity — a display filter must never make a screen disagree with a
// server-supplied count (that mismatch once showed as an empty welcome screen under a pulsing
// glyph; the welcome now renders `v.arrivals` directly, but the lesson generalises).
function peers(all) {
  const v = S.view; if (!v || !v.members) return [];
  let ms = [...v.members].sort((a, b) => (a.kind === 'self_node' ? -1 : b.kind === 'self_node' ? 1 : 0));
  // Hide-offline toggle: drop non-self peers whose derived status isn't online (self always stays).
  if (S.hideOffline && !all) ms = ms.filter(m => m.kind === 'self_node' || (m.status || (m.online ? 'online' : 'offline')) === 'online');
  const anchor = ms.find(m => (m.lat || 0) !== 0 || (m.lon || 0) !== 0);
  return ms.map((m) => {
    const st = m.status || (m.online ? 'online' : 'offline');
    let lat = m.lat || 0, lon = m.lon || 0, located = lat !== 0 || lon !== 0;
    if (!located && anchor) {
      const h = hash32(m.node_id);
      lat = anchor.lat + ((h & 0xffff) / 65535 - 0.5) * 0.02;
      lon = anchor.lon + (((h >>> 16) & 0xffff) / 65535 - 0.5) * 0.03;
    }
    return {
      m, name: m.label, lat, lon, located, hasAnchor: !!anchor, status: st,
      color: statusColor(st, m.kind), local: m.kind === 'self_node',
      kindWord: { self_node: 'SELF', gossip_peer: 'PEER', device_peer: 'DEVICE', device_agent: 'AGENT' }[m.kind] || 'NODE',
      ...seenParts(st, m.last_seen),
      session: m.session_start > 0 ? dur(nowS() - m.session_start) : '—',
      total: m.total_online_secs > 0 ? dur(m.total_online_secs) : '—',
      os: (m.os_version || m.os || '?') + (m.familiar_version ? ' · v' + m.familiar_version : ''),
      present: presentLine(m),
    };
  });
}

// Who is present at a node now, for how long, and how established — or 'unknown' when no
// evidence is fresh. present_human/via/since are set by members::derive_presence.
function presentLine(m) {
  if (!m.present_human && !m.present_via) return { text: 'unknown', known: false };
  const who = m.present_human || 'someone';
  const how = m.present_via ? ' · ' + m.present_via : '';
  const forr = m.present_since > 0 ? ' ' + dur(nowS() - m.present_since) : '';
  return { text: who + forr + how, known: true };
}

// The frontier: discovered-but-not-yet-contributing devices/services/paths. Smaller, faded,
// arcs dimmer and a different color — known, not yet part of the mesh's body.
function frontierNodes() {
  const v = S.view; if (!v || !v.frontier) return [];
  const P = peers();
  const anchor = P.find(p => p.located);
  return v.frontier.slice(0, 12).map(f => {
    const h = hash32(f.label + f.ip);
    return {
      f, name: f.label || f.ip, ip: f.ip, reach: f.reach,
      lat: anchor ? anchor.lat + ((h & 0xffff) / 65535 - 0.5) * 0.045 : 0,
      lon: anchor ? anchor.lon + (((h >>> 16) & 0xffff) / 65535 - 0.5) * 0.06 : 0,
      located: !!anchor,
    };
  });
}

// ---------- glyph library ----------
const GLYPHS = {

// The games' own control glyphs — back (chevron orbit) and begin (kindled play) — animated
// like everything else on the ring: wordless, alive.
const BACK_GLYPH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M15 18l-6-6 6-6" style="transform-box:fill-box;transform-origin:center;animation:iconpulse 2.4s ease-in-out infinite;"/></svg>`;
const BEGIN_GLYPH = `<svg viewBox="0 0 24 24" fill="none" style="width:20px;height:20px;"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.2" opacity="0.45" stroke-dasharray="3 4" style="transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite;"/><path d="M10 8.5v7l6-3.5z" fill="currentColor" style="transform-box:fill-box;transform-origin:center;animation:gatepulse 1.8s ease-in-out infinite;"/></svg>`;
// dive-to-surface glyph (map pin descending) and send glyph (plane) — controls, wordless
const DIVE_GLYPH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6" fill="currentColor" stroke="none" style="transform-box:fill-box;transform-origin:center;animation:iconpulse 2.2s ease-in-out infinite;"/></svg>`;
const SEND_GLYPH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>`;
const gateGlyph = (on) => `<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;">
  <circle cx="12" cy="12" r="9" stroke="${on ? '#3ddc97' : '#ff6e6e'}" stroke-width="1.4" opacity="0.5" stroke-dasharray="${on ? 'none' : '2 3'}" style="transform-box:fill-box;transform-origin:center;${on ? '' : 'animation:spin 8s linear infinite;'}"/>
  <circle cx="12" cy="12" r="4.4" fill="${on ? '#3ddc97' : '#ff6e6e'}" style="transform-box:fill-box;transform-origin:center;animation:gatepulse ${on ? '2.2s' : '3.4s'} ease-in-out infinite;"/>
</svg>`;

// ---------- hologram screens (real data; skeleton built once per screen, data refreshed in place) ----------
// No Gates screen: boundary gates are mesh functions, handled from the CLI / the familiar itself,
// not a console menu. The Device menu (the device's own allows) takes the slot Gates used to hold.
const SCREENS = ['conversation','roster','theories','work','signals','network','vision','games','device'];
// 'welcome' is reached from its own corner button, not the ring — a greeting with its own bell.
const SCTITLE = { conversation:'Dialogue', roster:'Roster', theories:'Theories', work:'Activity', signals:'Signals', network:'Network', vision:'Vision', games:'Games', node:'', device:'Device', welcome:'Welcome' };

function chip(t, color) { return `<span class="m" style="font-size:8px;letter-spacing:0.12em;padding:3px 8px;border-radius:6px;background:rgba(120,190,255,0.1);color:${color};">${esc(t)}</span>`; }
// The connectivity badge (ADR-0017): how a member is reaching the mesh right now.
function connBadge(mode) {
  if (mode === 'tailscale') return `<span class="m" style="font-size:8px;letter-spacing:0.1em;padding:3px 8px;border-radius:6px;background:rgba(61,220,151,0.14);color:#7ff0c0;">⇄ tailscale</span>`;
  if (mode === 'lighthouse') return `<span class="m" style="font-size:8px;letter-spacing:0.1em;padding:3px 8px;border-radius:6px;background:rgba(120,170,255,0.14);color:#a9c8ff;">⇢ lighthouse</span>`;
  if (mode === 'local') return `<span class="m" style="font-size:8px;letter-spacing:0.1em;padding:3px 8px;border-radius:6px;background:rgba(160,180,210,0.1);color:rgba(190,210,240,0.7);">· local</span>`;
  return '';
}

function buildScreen() {
  const el = $('scbody');
  $('sctitle').textContent = S.activeScreen === 'node' ? (peers()[S.nodeIdx]?.name ?? '') : SCTITLE[S.activeScreen];
  S.builtScreen = S.activeScreen;
  if (S.activeScreen === 'conversation') {
    // Persistent skeleton: the input row is created ONCE and survives data refreshes, so
    // typing is never interrupted by the poll cycle.
    el.innerHTML = `
      <div id="convmsgs" style="display:flex;flex-direction:column;gap:14px;max-width:760px;"></div>
      <div style="display:flex;gap:8px;max-width:760px;margin-top:18px;">
        <input id="convin" style="flex:1;padding:12px 15px;border-radius:12px;border:1px solid rgba(132,206,255,0.3);background:rgba(9,15,32,0.55);color:#eef2fb;font-size:14px;font-family:inherit;outline:none;">
        <button id="convsend" class="glybtn" style="width:46px;height:46px;border-radius:12px;flex-shrink:0;">${SEND_GLYPH}</button>
      </div>`;
    $('convin').addEventListener('keydown', (e) => { if (e.key === 'Enter') window.sphereSend(); });
    $('convsend').onclick = () => window.sphereSend();
  } else {
    el.innerHTML = `<div id="scdata"></div>`;
  }
  refreshScreen();
}

function refreshScreen() {
  const v = S.view;
  if (S.builtScreen !== S.activeScreen) { buildScreen(); return; }
  const k = S.activeScreen;

  // Don't rebuild the Device screen out from under the SERVING field while it's being typed in —
  // the poll cycle would otherwise recreate the input and drop focus/selection every second.
  if (k === 'device') {
    const inp = document.getElementById('servedHumanInput');
    if (inp && document.activeElement === inp) return;
  }

  if (k === 'conversation') {
    const box = $('convmsgs'); if (!box) return;
    if (!v) { box.innerHTML = ''; return; }
    const msgs = [];
    for (const o of [...(v.recent || [])].reverse()) {
      if (o.context === 'console' || /told|asked|answered|replied/.test(o.action)) {
        const human = o.actor !== 'familiar' && !o.actor.startsWith('mesh');
        // A human's words live in `object` (or `context` when `object` is a thread ref);
        // a familiar reply carries its text in `object`.
        const text = (o.object || '').startsWith('thread:') && o.context ? o.context : o.object;
        msgs.push({ f: !human, text });
      }
    }
    const q = (v.question || '').trim();
    // Who it is addressed to (ADR-0019 routing). A question put to Betty is shown as hers rather
    // than dropped in front of whoever is holding the device — that difference is the whole point
    // of giving questions owners. Absent from a guest projection, which names nobody.
    const qOwner = (v.question_owner || '').trim();
    if (q) msgs.push({ f: true, text: q, isQ: true, owner: qOwner });
    const html = msgs.slice(-14).map(mm => `
      <div style="align-self:${mm.f?'flex-start':'flex-end'};max-width:78%;padding:14px 17px;border-radius:16px;background:${mm.f?'rgba(20,44,80,0.3)':'rgba(90,170,255,0.12)'};border:1px solid ${mm.isQ?'rgba(174,231,255,0.5)':mm.f?'rgba(120,190,255,0.2)':'rgba(174,231,255,0.28)'};">
        ${mm.owner ? `<div class="m" style="font-size:8.5px;letter-spacing:0.14em;color:rgba(150,180,255,0.6);margin-bottom:6px;">ASKING ${esc(mm.owner.toUpperCase())}</div>` : ''}
        <div style="font-size:clamp(14px,1.6vw,17px);line-height:1.5;color:rgba(232,240,252,0.92);">${esc(mm.text)}</div>
      </div>`).join('');
    if (box.dataset.html !== html) { box.dataset.html = html; box.innerHTML = html; }
    return;
  }

  const el = $('scdata'); if (!el || !v) return;
  const P = peers();

  if (k === 'roster') {
    // Carry the ORIGINAL index through the partition — sphereNode/sphereDive index into peers(),
    // so filtering the grid without keeping `i` would dive to the wrong node.
    const pairs = P.map((p, i) => [p, i]);
    const past = pairs.filter(([p]) => isStale(p));
    const live = pairs.filter(([p]) => !isStale(p));
    // A member that runs ON another machine (a Mac's console shell — m.attached_to carries the
    // host's node_id) nests inside its host's card instead of standing as an unexplained
    // sibling. Still its own member — own key, own row in history, own dive — and if the host
    // is absent from the live roster the member stands alone again (quit the daemon and the
    // console honestly reappears at top level).
    const nestedIn = (host) => live.filter(([q]) => q.m.attached_to === host.m.node_id);
    const standing_ = live.filter(([p]) =>
      !p.m.attached_to || !live.some(([h]) => h.m.node_id === p.m.attached_to));
    const nestedRow = ([q, qi]) => `
      <div onclick="event.stopPropagation();sphereNode(${qi})" style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 12px;border-radius:11px;background:rgba(20,44,80,0.3);border:1px solid rgba(120,190,255,0.14);cursor:pointer;">
        <span style="width:7px;height:7px;border-radius:50%;background:${q.color};box-shadow:0 0 9px ${q.color};"></span>
        <span style="font-size:13px;font-weight:500;flex:1;letter-spacing:-0.01em;">${esc(q.name)}</span>
        ${chip(q.kindWord, '#bcd2ff')}
        <span class="m" style="font-size:8px;letter-spacing:0.12em;color:rgba(160,195,255,0.55);">${esc((q.status||'').toUpperCase())}</span>
      </div>`;
    // Accordion: every entry rests as one calm row — the name and its badges. A tap opens
    // the full card in place; the detail glyph inside goes deeper (the node screen); DIVE
    // still flies. Open state lives in S so the 3s poll can't slam cards shut.
    S.rosterOpen = S.rosterOpen || {};
    // The ember badge lands on the MACHINE's row: when a console holds the turn, its host
    // (the row the console nests under) wears the fire — a hidden nested row must never be
    // the only place the countdown lives.
    const emberIds = new Set();
    if (v.game && v.game.status === 'open') {
      emberIds.add(v.game.holder);
      const hp = pairs.find(([q]) => q.m.node_id === v.game.holder);
      if (hp && hp[0].m.attached_to) emberIds.add(hp[0].m.attached_to);
    }
    const headerRow = (p) => `
          <span style="width:9px;height:9px;border-radius:50%;background:${p.color};box-shadow:0 0 12px ${p.color};"></span>
          <span style="font-size:17px;font-weight:600;flex:1;letter-spacing:-0.01em;">${esc(p.name)}</span>
          ${chip(p.kindWord, p.local ? '#cdeeff' : '#bcd2ff')}
          ${(p.m.attached||[]).map(a => chip(esc(a), '#aee7ff')).join('')}
          ${(v.game && v.game.status === 'open' && emberIds.has(p.m.node_id))
            ? `<span onclick="event.stopPropagation();sphereGameJump();" title="to the game" class="m" style="cursor:pointer;font-size:8px;letter-spacing:0.1em;padding:3px 8px;border-radius:6px;background:rgba(255,178,102,0.16);color:#ffb266;animation:gatepulse 1.6s ease-in-out infinite;">${v.game.kind === 'campfire' ? '🔥 EMBER' : '🧩 TURN'} <span data-deadline="${v.game.holder_since + v.game.turn_secs}">--:--</span></span>` : ''}
          ${connBadge(p.m.connectivity)}`;
    const closedCard = ([p, i]) => `
      <div onclick="sphereRosterToggle('${p.m.node_id}')" style="cursor:pointer;padding:13px 17px;border-radius:14px;background:${p.local?'rgba(90,175,255,0.08)':'rgba(20,44,80,0.16)'};border:1px solid ${p.local?'rgba(174,231,255,0.2)':'rgba(120,190,255,0.12)'};display:flex;align-items:center;gap:9px;">
        ${headerRow(p)}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:13px;height:13px;color:rgba(160,195,255,0.45);flex-shrink:0;"><path d="M6 9l6 6 6-6"/></svg>
      </div>`;
    const card = ([p, i]) => `
      <div onclick="sphereRosterToggle('${p.m.node_id}')" style="cursor:pointer;padding:16px 17px;border-radius:16px;background:${p.local?'rgba(90,175,255,0.1)':'rgba(20,44,80,0.2)'};border:1px solid ${p.local?'rgba(174,231,255,0.28)':'rgba(120,190,255,0.16)'};">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;">
          ${headerRow(p)}
          <button onclick="event.stopPropagation();sphereNode(${i})" class="glybtn" style="width:30px;height:30px;border-radius:9px;flex-shrink:0;" title="detail">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="12" r="9" opacity="0.4"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.8" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="m" style="font-size:9.5px;color:rgba(160,195,255,0.58);margin-bottom:6px;">${esc(p.os)}</div>
        ${p.m.detail ? `<div class="m" style="font-size:10px;color:rgba(174,231,255,0.7);margin-bottom:8px;">${esc(p.m.detail)}</div>` : ''}
        <div class="m" style="font-size:9.5px;color:rgba(160,195,255,0.58);margin-bottom:9px;">${dstr(p.m.first_seen)}${p.m.human?' · serves '+esc(p.m.human):''}${p.m.ai?' · ai':''} · ${p.located ? p.lat.toFixed(3)+'°, '+p.lon.toFixed(3)+'°' : p.hasAnchor ? '≈' : '—'}</div>
        <div class="m" style="font-size:9.5px;margin-bottom:13px;display:flex;align-items:center;gap:6px;color:${p.present.known?'rgba(174,231,255,0.82)':'rgba(150,170,200,0.45)'};"><span style="width:6px;height:6px;border-radius:50%;flex-shrink:0;background:${p.present.known?'#aee7ff':'rgba(140,160,190,0.4)'};${p.present.known?'box-shadow:0 0 7px #aee7ff;':''}"></span><span style="letter-spacing:0.1em;font-size:7px;color:rgba(150,180,255,0.55);">PRESENT</span> ${esc(p.present.text)}</div>
        <div style="display:grid;grid-template-columns:minmax(84px,auto) auto auto;justify-content:start;gap:18px;align-items:end;margin-bottom:12px;">
          <div>${seenCell(p, 26, 16)}<div class="m" style="font-size:7px;letter-spacing:0.14em;color:rgba(150,180,255,0.55);margin-top:5px;">SEEN</div></div>
          <div><div style="font-size:18px;font-weight:300;line-height:0.85;color:#aee7ff;">${esc(p.session)}</div><div class="m" style="font-size:7px;letter-spacing:0.14em;color:rgba(150,180,255,0.55);margin-top:5px;">SESSION</div></div>
          <div><div style="font-size:18px;font-weight:300;line-height:0.85;color:#9cc0ff;">${esc(p.total)}</div><div class="m" style="font-size:7px;letter-spacing:0.14em;color:rgba(150,180,255,0.55);margin-top:5px;">TOTAL</div></div>
        </div>
        <div style="height:4px;border-radius:5px;background:rgba(255,255,255,0.06);overflow:hidden;margin-bottom:13px;"><div style="height:100%;width:${p.status==='online'?100:p.status==='away'?45:8}%;border-radius:5px;background:${p.color};box-shadow:0 0 8px ${p.color};"></div></div>
        ${nestedIn(p).map(nestedRow).join('')}
        <button onclick="event.stopPropagation();sphereDive(${i})" class="glybtn" style="width:100%;height:38px;border-radius:11px;">${DIVE_GLYPH}</button>
      </div>`;

    // The history button only exists when there IS a history — an empty toggle is furniture.
    const bar = past.length ? `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button onclick="sphereRosterHistory()" class="glybtn" style="height:32px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:8px;">
          <span class="m" style="font-size:9px;letter-spacing:0.14em;color:${S.rosterHistory ? '#aee7ff' : 'rgba(160,195,255,0.72)'};">
            ${S.rosterHistory ? 'LIVE ROSTER' : 'HISTORY · ' + past.length}
          </span>
        </button>
        <span class="m" style="font-size:9px;color:rgba(150,180,255,0.45);">
          ${S.rosterHistory ? 'members not seen in over 24h' : ''}
        </span>
      </div>` : '';

    const table = () => `
      <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="text-align:left;">
          ${['MEMBER','ROLE','OS · VERSION','LAST SEEN','TOTAL','SERVED','POSITION','VIA'].map(h =>

  } else if (k === 'welcome') {
    // A greeting, not a gate (ADR-0026): who is new — the last 24 hours of members, devices,

    const myHuman = ((S.device || {}).presence || {}).handle || (S.device || {}).servedHuman || '';
    const dismissed = (S.dismissedClaims = S.dismissedClaims || {});
    const claims = (v.claims_waiting || []).filter(c =>

    const claimsHtml = claims.map(c => `

        <div class="m" style="font-size:9.5px;color:rgba(180,215,190,0.7);margin-bottom:10px;">

        </div>
        <div style="display:flex;gap:10px;">
          <button onclick='toApp("vouch",{node_id:${JSON.stringify(c.node_id)},pubkey:${JSON.stringify(c.pubkey)},handle:${JSON.stringify(c.handle)}})'
                  style="padding:9px 16px;border-radius:10px;background:rgba(61,220,151,0.18);border:1px solid rgba(61,220,151,0.45);color:#9fe8c0;cursor:pointer;font-size:12px;">
            Yes — it's mine
          </button>
          <button onclick="sphereClaimDismiss('${c.node_id.replace(/[^a-f0-9]/gi, '')}')"
                  style="padding:9px 16px;border-radius:10px;background:rgba(16,34,60,0.3);border:1px solid rgba(120,190,255,0.2);color:rgba(188,210,255,0.75);cursor:pointer;font-size:12px;">
            Not mine

        </div>

         </div>`
      : `<div class="m" style="font-size:11px;color:rgba(160,195,255,0.6);margin-bottom:14px;">

  } else if (k === 'games') {
    // The mesh games. The screens say — prominently — which seams each game exercises,

    const myId = (S.device || {}).node_id || '';

    if (nav === 'menu') {
      const gameCard = (key, title, flavor, glyph) => `
        <div onclick="sphereGameNav('info-${key}')" style="cursor:pointer;padding:22px 20px;border-radius:18px;background:rgba(20,44,80,0.24);border:1px solid rgba(120,190,255,0.2);display:flex;align-items:center;gap:18px;">

          <div style="flex:1;">
            <div style="font-size:18px;font-weight:600;margin-bottom:5px;">${title}</div>

        </div>`;
      el.innerHTML = `<div style="max-width:640px;display:flex;flex-direction:column;gap:14px;">
        <div class="m" style="font-size:10.5px;color:rgba(160,195,255,0.6);margin-bottom:2px;">

        </div>
        ${gameCard('riddle', 'Riddle of the Mesh', 'the familiar asks; the ember passes; one right answer takes it', GLYPHS.theories)}
        ${gameCard('campfire', 'The Campfire', 'one story, one line each, the ember chooses whose turn it is', `<svg viewBox="0 0 48 48" style="width:100%;height:100%;overflow:visible;"><path d="M24 6c3 7-6 9-4 16 1.4 4.6 8 5 9-1 4 4 6 8 4 13-2.4 5.7-14 6.5-17-1-2.6-7 3-10 4-14 2 3 5 3 5-1 0-4-2-7-1-12z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" style="transform-box:fill-box;transform-origin:center bottom;animation:eqb 1.6s ease-in-out infinite;"/><circle cx="24" cy="33" r="3" fill="currentColor" style="transform-box:fill-box;transform-origin:center;animation:gatepulse 1.4s ease-in-out infinite;"/></svg>`)}
        ${g && g.status === 'done' ? `
          <div style="padding:14px 16px;border-radius:13px;background:rgba(20,44,80,0.18);border:1px solid rgba(120,190,255,0.13);">
            <div class="m" style="font-size:8px;letter-spacing:0.16em;color:rgba(150,180,255,0.55);margin-bottom:7px;">LAST GAME</div>
            <div class="m" style="font-size:11px;color:rgba(188,210,255,0.8);">${esc(g.verdict || 'finished')}</div>
            <button onclick="sphereGameNav('live')" class="glybtn" style="margin-top:9px;height:30px;padding:0 12px;border-radius:9px;"><span class="m" style="font-size:8.5px;letter-spacing:0.14em;">SEE IT</span></button>
          </div>` : ''}
      </div>`;

    } else if (nav === 'info-riddle' || nav === 'info-campfire') {
      const riddle = nav === 'info-riddle';
      el.innerHTML = `<div style="max-width:640px;">

        ${tests(riddle ? [
          'signed member acts — every guess is an ed25519-signed write the door verifies',
          'standing &amp; identity — only admitted members may play; guests see no game at all',
          'turn state traveling doors — the ember rides record-sync between wildhorse and the lighthouse',
          'the lazy clock — turn expiry is enforced by whichever door reads next, no game loop anywhere',
          'worldview latency — how fast your console learns the ember moved',
        ] : [
          'everything the riddle tests, plus:',
          'multi-door last-writer-wins — two people acting at two doors must converge on one story',

          ${p.node_id === g.holder && open ? `<span class="m" style="font-size:8px;letter-spacing:0.12em;color:#ffb266;">${g.kind === 'campfire' ? '🔥' : '🧩'} ${cd(deadline).replace('--:--','')}</span>` : ''}

      const entryRow = (e) => `

            ${g.players.map(playerRow).join('')}
          </div>
        </div>
        ${mine ? `
          <div style="margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(255,178,102,0.08);border:1px solid rgba(255,178,102,0.35);">
            <div class="m" style="font-size:8px;letter-spacing:0.16em;color:#ffb266;margin-bottom:8px;">${g.kind === 'riddle' ? 'YOUR GUESS' : 'YOUR LINE — THEN THE EMBER MOVES'}</div>
            <div style="display:flex;gap:9px;">
              <input id="gameinput" placeholder="${g.kind === 'riddle' ? 'one guess…' : 'one line of the story…'}" maxlength="240" spellcheck="true"
                onkeydown="if(event.key==='Enter'){sphereGameSubmit();}"
                style="flex:1;background:rgba(16,34,60,0.5);border:1px solid rgba(255,178,102,0.3);border-radius:10px;color:#e8f0fc;font-size:13px;padding:10px 12px;"/>
              <button onclick="sphereGameSubmit()" class="glybtn" style="width:46px;height:42px;border-radius:10px;">${SEND_GLYPH}</button>
            </div>
            ${g.kind === 'campfire' ? `
              <div class="m" style="font-size:8px;letter-spacing:0.14em;color:rgba(150,180,255,0.55);margin:10px 0 5px;">HAND THE EMBER TO</div>
              <div style="display:flex;gap:7px;flex-wrap:wrap;">
                <button onclick="sphereGamePassTo('')" class="glybtn" style="height:28px;padding:0 11px;border-radius:8px;${!S.gamePassTo ? 'border-color:rgba(255,178,102,0.5);color:#ffb266;' : ''}"><span class="m" style="font-size:8.5px;">THE CIRCLE</span></button>
                ${g.players.filter(p => !p.eliminated && p.node_id !== myId).map(p => `
                  <button onclick="sphereGamePassTo('${p.node_id}')" class="glybtn" style="height:28px;padding:0 11px;border-radius:8px;${S.gamePassTo === p.node_id ? 'border-color:rgba(255,178,102,0.5);color:#ffb266;' : ''}"><span class="m" style="font-size:8.5px;">${esc(p.label.toUpperCase())}</span></button>`).join('')}
              </div>` : ''}
            ${g.kind === 'riddle' ? `<button onclick="toApp('game',{act:'pass',to:''});" class="glybtn" style="margin-top:9px;height:28px;padding:0 12px;border-radius:8px;"><span class="m" style="font-size:8.5px;letter-spacing:0.12em;">PASS — NO GUESS</span></button>` : ''}
          </div>` : ''}
        ${open && !mine ? `<div class="m" style="font-size:10px;color:rgba(160,195,255,0.55);margin-top:12px;">the ember is with ${esc(holderP ? holderP.label : 'someone')} — your console will chime when it reaches you</div>` : ''}
        ${open && g.started_by === myId ? `<button onclick="sphereGameClose()" class="glybtn" style="margin-top:12px;height:28px;padding:0 12px;border-radius:8px;${S.closeArmed ? 'background:rgba(60,10,16,0.5);border-color:rgba(255,110,110,0.6);' : ''}"><span class="m" style="font-size:8.5px;letter-spacing:0.12em;color:#ff8fa3;">${S.closeArmed ? 'TAP AGAIN TO CLOSE' : 'CLOSE THE GAME'}</span></button>` : ''}
        ${!open ? `<div style="margin-top:14px;">${glybtn("sphereGameNav('menu')", BACK_GLYPH, 'BACK TO THE GAMES', false)}</div>` : ''}
      </div>`;

function renderButtons() {
  const N = SCREENS.length, Rx = 46, Ry = 45;

  const gg = (S.view || {}).game;
  const myTurn = gg && gg.status === 'open' && gg.holder === ((S.device || {}).node_id || '');

  // dead centre bottom, on top of the surface toggle (it ate the zoom button under signals).
  // Odd counts start AT top centre instead: evenly spaced, mirror-symmetric about the
  // vertical axis, and the bottom-centre slot (the toggle's home) falls between buttons.

    return `<button class="scrbtn" title="${SCTITLE[key]}" onclick="sphereScreen('${key}')" style="left:${(50 + Math.cos(ang) * Rx).toFixed(2)}%;top:${(50 + Math.sin(ang) * Ry).toFixed(2)}%;background:${warm ? 'radial-gradient(circle, rgba(255,178,102,0.4), transparent 66%)' : on ? 'radial-gradient(circle, rgba(120,190,255,0.42), transparent 66%)' : 'radial-gradient(circle, rgba(90,160,255,0.07), transparent 70%)'};">

// ---------- three.js globe ----------
const G = { anchorDirs: [], frontierDirs: [], arcs: [], frontierArcs: [], streetA: 0 };
const latLon = (lat, lon) => { const phi = (90 - lat) * Math.PI / 180, theta = (lon + 180) * Math.PI / 180; return new THREE.Vector3(-Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)).normalize(); };

// The choreographed dive. Phase 0: the globe ROTATES to center the target (no zoom).
// Then the zoom timeline: first 25% pure satellite zoom; middle 50% a synchronized
// crossfade — satellite fading out while REAL Apple Maps fades in, both descending in
// step; last 25% street map only, zooming to close detail (MapKit finishes the flight).
const ROTATE_MS = 900, ZOOM_MS = 3200;
// Where "centred" actually is. The camera ORBITS (autoRotate, and the human can drag), so the
// point under the camera is `camera.position` normalised — not world +Z. Aiming the target at
// +Z centred it only in the one case where the camera happened to be sitting there; every other
// time the globe swung the target off to wherever +Z had drifted to, which is the "spins to a
// random spot" before the zoom. Recomputed each frame so leftover damping can't re-open the gap.
//
// The roll matters too: we hand off to an MKMapCamera with heading 0 (north up), so the sphere
// has to arrive north-up as well or the satellite and the map sit rotated against each other for
// the whole crossfade.
function diveAimQ() {
  const camDir = G.camera.position.clone().normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(G.diveDir, camDir);
  const up = G.camera.up.clone();
  const screenUp = up.sub(camDir.clone().multiplyScalar(up.dot(camDir)));
  const north = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  const northProj = north.sub(camDir.clone().multiplyScalar(north.dot(camDir)));
  // Degenerate when the target IS a pole (north projects to nothing) — leave the roll alone.
  if (screenUp.lengthSq() > 1e-8 && northProj.lengthSq() > 1e-8) {
    screenUp.normalize(); northProj.normalize();
    const ang = Math.atan2(northProj.clone().cross(screenUp).dot(camDir), northProj.dot(screenUp));
    q.premultiply(new THREE.Quaternion().setFromAxisAngle(camDir, ang));
  }
  return q;
}
function beginDive(target, dir) {

  G.diveStartQ = G.group.quaternion.clone();

window.sphereDive = (i) => {
  const P = peers(); const p = P[i]; if (!p) return;
  if (!p.located && !p.hasAnchor) { window.sphereScreen('network'); return; }

  beginDive(p, G.anchorDirs[i]);
};
window.sphereDiveFrontier = (i) => {
  const F = frontierNodes(); const f = F[i]; if (!f || !f.located) return;
  beginDive({ lat: f.lat, lon: f.lon, name: f.name, color: FRONTIER_COLOR }, G.frontierDirs[i] || latLon(f.lat, f.lon));
};
function collectNodes() {
  const P = peers(), F = frontierNodes();
  return P.filter(p => p.located || p.hasAnchor).map(p => ({ lat: p.lat, lon: p.lon, label: p.name, sublabel: p.m.addr || '', color: p.color, frontier: false, self: p.local }))
    .concat(F.filter(f => f.located).map(f => ({ lat: f.lat, lon: f.lon, label: f.name, sublabel: [f.ip, f.reach].filter(Boolean).join(' · '), color: FRONTIER_COLOR, frontier: true, self: false })));
}
function handoff(p) {

  // synchronized crossfade: satellite out over the middle 50% of the zoom; arcs surface with the map
  const fade = (ZOOM_MS * 0.5 / 1000) + 's';
  for (const id of ['space','globe','vignette']) { const e = $(id); e.style.transition = 'opacity ' + fade; e.style.opacity = '0'; }
  const sa = $('streetArcs'); sa.style.transition = 'opacity ' + fade; sa.style.opacity = '1';

function initThree() {
  const canvas = $('globe');

  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 0, 3.5);
  const controls = new OrbitControls(camera, canvas);

  controls.enablePan = false; controls.minDistance = 2.05; controls.maxDistance = 6;
  controls.autoRotate = true; controls.autoRotateSpeed = 0.14; controls.rotateSpeed = 0.5;
  const group = new THREE.Group(); scene.add(group);
  Object.assign(G, { renderer, scene, camera, controls, group });

  const geo = new THREE.SphereGeometry(1, 256, 128);
  const mgr = new THREE.LoadingManager();

  const base = 'vendor/textures/';

  const dayTex = loader.load(base + 'earth-blue-marble.jpg');

  [dayTex, topoTex, waterTex, nightTex].forEach(t => { t.anisotropy = maxAniso; });

  const sunDir = new THREE.Vector3(1, 0.28, 0.55).normalize();
  const earthMat = new THREE.MeshStandardMaterial({ map: dayTex, displacementMap: topoTex, displacementScale: 0.14, bumpMap: topoTex, bumpScale: 0.02, roughnessMap: waterTex, metalness: 0.02, roughness: 0.78, transparent: true, opacity: 1 });

    sh.fragmentShader = 'uniform vec3 uSun; uniform sampler2D uNight; varying vec3 vWNormal;\n' + sh.fragmentShader
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>

         #include <opaque_fragment>`);
  };
  group.add(new THREE.Mesh(geo, earthMat));
  group.add(new THREE.Mesh(new THREE.SphereGeometry(1.006, 48, 30), new THREE.MeshBasicMaterial({ color: new THREE.Color('#8fd0ff'), wireframe: true, transparent: true, opacity: 0.06, depthWrite: false })));
  const atmoMat = new THREE.ShaderMaterial({ transparent: true, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false,
    uniforms: { uColor: { value: new THREE.Color('#3f82ff') }, uInt: { value: 0.25 } },
    vertexShader: 'varying vec3 vN; varying vec3 vE; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vE=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }',
    fragmentShader: 'varying vec3 vN; varying vec3 vE; uniform vec3 uColor; uniform float uInt; void main(){ float f=pow(1.0-abs(dot(vN,vE)),3.0); gl_FragColor=vec4(uColor,f*uInt); }' });
  group.add(new THREE.Mesh(new THREE.SphereGeometry(1.16, 64, 48), atmoMat));
  scene.add(new THREE.AmbientLight(0x1b2540, 0.55));
  const key = new THREE.DirectionalLight(0xfff4e6, 1.75); key.position.copy(sunDir).multiplyScalar(5); scene.add(key);
  const rim = new THREE.DirectionalLight(0x5f9bff, 0.4); rim.position.set(-3, -1, -2); scene.add(rim);
  const starGeo = new THREE.BufferGeometry(); const starN = 800; const spr = new Float32Array(starN * 3);
  for (let i = 0; i < starN; i++) { const r = 16 + Math.random()*20, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random() - 1); spr[i*3]=r*Math.sin(ph)*Math.cos(th); spr[i*3+1]=r*Math.sin(ph)*Math.sin(th); spr[i*3+2]=r*Math.cos(ph); }
  starGeo.setAttribute('position', new THREE.BufferAttribute(spr, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x9cc0ff, size: 0.055, transparent: true, opacity: 0.5, sizeAttenuation: true })));

  // spark sprite texture shared by all arcs
  const pc = document.createElement('canvas'); pc.width = pc.height = 64;
  const pg = pc.getContext('2d'); const pgr = pg.createRadialGradient(32, 32, 0, 32, 32, 32);
  pgr.addColorStop(0, 'rgba(255,255,255,1)'); pgr.addColorStop(0.4, 'rgba(174,231,255,1)'); pgr.addColorStop(1, 'rgba(174,231,255,0)');
  pg.fillStyle = pgr; pg.beginPath(); pg.arc(32, 32, 32, 0, Math.PI*2); pg.fill();
  G.dotTex = new THREE.CanvasTexture(pc);
  G.arcGroup = new THREE.Group(); group.add(G.arcGroup);

  const resize = () => {
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    renderer.setPixelRatio(dpr); renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(canvas); resize();

  let doneLoad = false;
  mgr.onLoad = () => { doneLoad = true; S.loading = false; renderChrome(); };
  setTimeout(() => { if (!doneLoad) { S.loading = false; renderChrome(); } }, 6000);

  const clock = new THREE.Clock();
  const worldPos = new THREE.Vector3(), worldNorm = new THREE.Vector3(), camDir = new THREE.Vector3();
  let last = performance.now();
  const loop = () => {
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    const now = performance.now(); const dt = Math.min((now - last)/1000, 0.05); last = now;
    if (G.ascending) {
      const ap = Math.min(1, (performance.now() - G.ascendT0)/(ZOOM_MS * 0.75));

    }

    controls.update();
    renderer.render(scene, camera);

    const co = $('callouts');
    const vis = S.mode === 'globe' && !G.diving ? 1 : 0;
    co.style.opacity = vis > 0.05 ? String(vis) : '0';
    if (vis > 0.05) {
      const rect = canvas.getBoundingClientRect();
      camera.getWorldDirection(camDir);
      const els = co.querySelectorAll('[data-callout]');
      const dirs = [...G.anchorDirs, ...G.frontierDirs];
      for (let i = 0; i < dirs.length; i++) {
        const el = els[i]; if (!el) continue;
        worldNorm.copy(dirs[i]).applyQuaternion(group.quaternion).normalize();
        worldPos.copy(worldNorm).multiplyScalar(1.02 * breath);
        if (worldNorm.dot(camDir) >= -0.12) { el.style.display = 'none'; continue; }
        const proj = worldPos.clone().project(camera);
        el.style.display = 'block';
        el.style.transform = `translate(${((proj.x*0.5 + 0.5)*rect.width).toFixed(1)}px, ${((-proj.y*0.5 + 0.5)*rect.height).toFixed(1)}px)`;
      }
    }

  };
  loop();
}

// ---------- electric arcs: bright between members, dim slate to the frontier ----------
function mkArc(a, b, palette) {
  const N = 96;
  const ang = Math.max(0.001, a.angleTo(b)); const lift = Math.min(0.13, 0.04 + ang * 0.06);
  const bs = [], biN = [], radN = [];
  for (let sI = 0; sI <= N; sI++) { const tt = sI / N; const v = a.clone().multiplyScalar(Math.sin((1 - tt) * ang) / Math.sin(ang)).add(b.clone().multiplyScalar(Math.sin(tt * ang) / Math.sin(ang))); v.setLength(1.02 + Math.sin(Math.PI * tt) * lift); bs.push(v); }
  for (let sI = 0; sI <= N; sI++) { const rad = bs[sI].clone().normalize(); const tan = bs[Math.min(N, sI + 1)].clone().sub(bs[Math.max(0, sI - 1)]).normalize(); biN.push(new THREE.Vector3().crossVectors(tan, rad).normalize()); radN.push(rad); }
  const mkLine = (color, op) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((N + 1) * 3), 3)); const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false }); const line = new THREE.Line(g, m); line.frustumCulled = false; G.arcGroup.add(line); return { g, m }; };
  const core = mkLine(palette.core, 0), glow = mkLine(palette.glow, 0), branch = mkLine(palette.branch, 0);
  const mkSpark = (col, sc) => { const mm = new THREE.SpriteMaterial({ map: G.dotTex, color: col, transparent: true, opacity: 0, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending }); const sp = new THREE.Sprite(mm); sp.scale.setScalar(sc); G.arcGroup.add(sp); return { sp, mm }; };
  const sparks = palette.sparks ? [mkSpark(0xffffff, 0.085), mkSpark(0xaee7ff, 0.055), mkSpark(0xbfe0ff, 0.04)] : [mkSpark(palette.core, 0.045)];
  return { base: bs, biN, radN, N, core, glow, branch, sparks, gain: palette.gain, speed: 0.10 + Math.random()*0.06, phase: Math.random()*10, seed: Math.random()*100, jrate: 3.5 + Math.random()*2 };
}
function rebuildArcs() {
  if (!G.arcGroup) return;
  G.arcGroup.clear();
  G.arcs = []; G.frontierArcs = [];
  const P = peers();
  const selfIdx = P.findIndex(p => p.local);
  if (selfIdx < 0 || !G.anchorDirs.length) return;
  const from = G.anchorDirs[selfIdx];
  // Members: the mesh's live body — bright, white-blue, sparking.
  for (let i = 0; i < G.anchorDirs.length; i++) {
    if (i === selfIdx) continue;
    G.arcs.push(mkArc(from.clone(), G.anchorDirs[i].clone(), { core: 0xe4f6ff, glow: 0x4d93ff, branch: 0x8fd0ff, sparks: true, gain: 1 }));
  }
  // Frontier: discovered, not yet contributing — dimmer, slate, one faint spark.
  for (const d of G.frontierDirs) {
    G.frontierArcs.push(mkArc(from.clone(), d.clone(), { core: 0x7d93a8, glow: 0x51677a, branch: 0x62788c, sparks: false, gain: 0.3 }));
  }
}
const arcTmp = new THREE.Vector3();
function animateArcs(t) {
  const on = (S.mode === 'globe' && !G.diving) ? 1 : 0;
  for (const arc of [...G.arcs, ...G.frontierArcs]) {
    const N2 = arc.N, gain = arc.gain;
    const fl = 0.6 + 0.4 * Math.sin(t * arc.jrate + arc.seed) * Math.sin(t * 2.3 + arc.seed * 1.7);
    const crackle = (Math.sin(t * 30 + arc.seed) > 0.86) ? 0.35 : 1.0;
    const cP = arc.core.g.attributes.position.array, gP = arc.glow.g.attributes.position.array, bP = arc.branch.g.attributes.position.array;
    for (let sI = 0; sI <= N2; sI++) {
      const tt = sI / N2, env = Math.sin(Math.PI * tt), bi = arc.biN[sI], rad = arc.radN[sI], p = arc.base[sI];
      const n1 = Math.sin(tt * 17 + t * arc.jrate + arc.seed), n2 = Math.sin(tt * 41 - t * (arc.jrate * 1.7) + arc.seed * 2.1), n3 = Math.sin(tt * 7 + t * 2.0 + arc.seed);
      const off = (n1 * 0.6 + n2 * 0.28 + n3 * 0.5) * 0.05 * env * gain, rOff = (Math.sin(tt * 23 + t * 5 + arc.seed) * 0.5) * 0.03 * env;
      arcTmp.copy(p).addScaledVector(bi, off).addScaledVector(rad, rOff); cP[sI*3]=arcTmp.x; cP[sI*3+1]=arcTmp.y; cP[sI*3+2]=arcTmp.z;
      const goff = (n1 * 0.6 + n3 * 0.7) * 0.06 * env * gain; arcTmp.copy(p).addScaledVector(bi, goff).addScaledVector(rad, rOff * 0.6); gP[sI*3]=arcTmp.x; gP[sI*3+1]=arcTmp.y; gP[sI*3+2]=arcTmp.z;
      const boff = -(n2 * 0.9 + Math.sin(tt*61+t*13+arc.seed)*0.5) * 0.055 * env * gain; arcTmp.copy(p).addScaledVector(bi, boff).addScaledVector(rad, -rOff); bP[sI*3]=arcTmp.x; bP[sI*3+1]=arcTmp.y; bP[sI*3+2]=arcTmp.z;
    }
    arc.core.g.attributes.position.needsUpdate = true; arc.glow.g.attributes.position.needsUpdate = true; arc.branch.g.attributes.position.needsUpdate = true;
    arc.core.m.opacity = on * gain * (0.75 + 0.25 * fl) * crackle;
    arc.glow.m.opacity = on * gain * 0.32 * (0.6 + 0.4 * fl);
    arc.branch.m.opacity = on * gain * (0.28 + 0.3 * Math.abs(fl)) * crackle;
    const sample = (pp) => { const idx = Math.max(0, Math.min(N2, Math.floor(pp * N2))); const arr = arc.core.g.attributes.position.array; arcTmp.set(arr[idx*3], arr[idx*3+1], arr[idx*3+2]); return arcTmp; };
    arc.sparks.forEach((sk, si) => {
      const pp = (t * arc.speed * (1 + si*0.4) + arc.phase + si*0.33) % 1;
      sk.sp.position.copy(sample(pp));
      sk.mm.opacity = on * gain * 0.85 * Math.sin(pp*Math.PI) * (si === 2 ? crackle : 1);
    });
  }
}

// ---- street-level arcs: 2D lightning between host-projected screen points ----
let streetPts = [];
window.streetArcPoints = (pts) => { streetPts = pts || []; };
(function streetArcLoop() {
  const cv = $('streetArcs'); const ctx = cv.getContext('2d');
  const draw = (tms) => {
    requestAnimationFrame(draw);
    if (S.mode !== 'street' && !parseFloat(cv.style.opacity)) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w*dpr || cv.height !== h*dpr) { cv.width = w*dpr; cv.height = h*dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const t = tms/1000;
    const selfP = streetPts.find(p => p.self);
    if (!selfP) return;
    for (const p of streetPts) {
      if (p.self) continue;
      const seg = 22, x1 = selfP.x, y1 = selfP.y, x2 = p.x, y2 = p.y;
      const nx = -(y2 - y1), ny = (x2 - x1), L = Math.hypot(nx, ny) || 1;
      if (L < 8) continue;
      const bright = !p.frontier;
      const seed = (p.label || '').length * 7.3;
      for (const [width, alpha, amp, color] of bright
        ? [[2.2, 0.85, 18, '#e4f6ff'], [4.5, 0.25, 22, '#4d93ff'], [1.2, 0.5, 26, '#8fd0ff']]
        : [[1.4, 0.35, 12, '#7d93a8']]) {
        ctx.beginPath();
        for (let i = 0; i <= seg; i++) {
          const tt = i/seg;
          let x = x1 + (x2 - x1)*tt, y = y1 + (y2 - y1)*tt;
          const env = Math.sin(Math.PI*tt);
          const off = (Math.sin(tt*13 + t*9 + seed)*0.6 + Math.sin(tt*33 - t*14 + seed)*0.4) * amp * env;
          x += nx/L*off; y += ny/L*off;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        const crackle = (Math.sin(t*30 + seed) > 0.86) ? 0.4 : 1.0;
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha * crackle;
        ctx.shadowColor = color; ctx.shadowBlur = bright ? 10 : 5;
        ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      // travelling spark on bright arcs
      if (bright) {
        const pp = (t*0.35 + seed) % 1;
        const tt = pp, env = Math.sin(Math.PI*tt);
        let x = x1 + (x2 - x1)*tt, y = y1 + (y2 - y1)*tt;
        const off = (Math.sin(tt*13 + t*9 + seed)*0.6 + Math.sin(tt*33 - t*14 + seed)*0.4) * 18 * env;
        x += nx/L*off; y += ny/L*off;
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#aee7ff'; ctx.shadowBlur = 12;
        ctx.globalAlpha = 0.9 * env;
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    }

  requestAnimationFrame(draw);
})();

renderButtons(); renderChrome(); buildScreen();
