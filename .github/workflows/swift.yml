name: Swift

# The iOS/Mac green bar, enforced. Mirrors ios/README.md §Build & test: the FamiliarMesh
# package tests, then xcodegen, then both app builds (Mac Release, iOS Simulator).
# Runs on the xcode-27 image (macOS 26, default Xcode 27 beta) — this project builds
# with the newest Xcode, period (Ian, 2026-08-25: "We have Xcode 27. I don't know why
# we would use anything else"). It is also a hard requirement, not a preference:
# ConsultRunner's PCC lane uses PrivateCloudComputeLanguageModel, a 27-SDK API that
# Xcode 26.6 cannot compile — proven by run 32862377387 failing on macos-26. When a
# newer Xcode gets its own runner label, move this forward, never back. Signing is
# disabled: runners hold no certificates, and the bar is "it compiles", not "it ships".

on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', '.github/workflows/swift.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/swift.yml']

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-bar:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: FamiliarMesh package tests
        run: swift test --package-path ios/FamiliarMesh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      - name: Build FamiliarMac (Release)
        working-directory: ios
        run: |
          xcodebuild -project FamiliarAgent.xcodeproj -scheme FamiliarMac \
            -configuration Release CODE_SIGNING_ALLOWED=NO build

      # No -sdk flag here: the scheme embeds the watch app, and forcing every target
      # onto the iPhone SDK makes actool compile the watchOS-only AppIcon for iphonesimulator,
      # where it has no applicable content. The destination picks the right SDK per target.
      - name: Build FamiliarAgent (iOS Simulator)
        working-directory: ios
        run: |
          xcodebuild -project FamiliarAgent.xcodeproj -scheme FamiliarAgent \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
