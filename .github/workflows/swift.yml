name: Swift

# The iOS/Mac green bar, enforced. Mirrors ios/README.md §Build & test: the FamiliarMesh
# package tests, then xcodegen, then both app builds (Mac Release, iOS Simulator).
# Runs on the macos-26 image (default Xcode 26.6) because Shared/Sources imports
# FoundationModels, which needs the 26 SDK. Signing is disabled: runners hold no
# certificates, and the bar is "it compiles", not "it ships".

on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', '.github/workflows/swift.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/swift.yml']

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-bar:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: FamiliarMesh package tests
        run: swift test --package-path ios/FamiliarMesh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      - name: Build FamiliarMac (Release)
        working-directory: ios
        run: |
          xcodebuild -project FamiliarAgent.xcodeproj -scheme FamiliarMac \
            -configuration Release CODE_SIGNING_ALLOWED=NO build

      # No -sdk flag here: the scheme embeds the watch app, and forcing every target
      # onto the iPhone SDK makes actool compile the watchOS-only AppIcon for iphonesimulator,
      # where it has no applicable content. The destination picks the right SDK per target.
      - name: Build FamiliarAgent (iOS Simulator)
        working-directory: ios
        run: |
          xcodebuild -project FamiliarAgent.xcodeproj -scheme FamiliarAgent \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
